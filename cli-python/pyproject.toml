[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "header-auditor"
version = "0.1.0"
description = "Grade a website's HTTP security headers from the command line."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "bandit>=1.7"]

[project.scripts]
header-auditor = "header_auditor.cli:main"

[tool.setuptools]
packages = ["header_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
