# Local development services for header-auditor.
#
#   cp .env.example .env    # then set real local passwords
#   docker compose up -d    # Postgres on 127.0.0.1:5432, Redis on 127.0.0.1:6379
#   pnpm --filter @header-auditor/db migrate:deploy
#
# Ports are bound to 127.0.0.1 only, so the databases are never exposed on
# the LAN. Passwords have no defaults: compose refuses to start without them.
# api, worker and web join this file in later roadmap steps.

name: header-auditor

services:
  postgres:
    # Same major version as PGlite, which the db package tests run against.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-header_auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-header_auditor}
      # Use SCRAM, not md5, for password authentication.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    # Queue backend for BullMQ (roadmap step 15).
    image: redis:7.4-alpine
    restart: unless-stopped
    # requirepass so other local processes can't push jobs into the queue;
    # appendonly so queued scans survive a restart. The password is passed via
    # the environment (not the command line) to keep it out of `ps` output.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
