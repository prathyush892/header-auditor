packages:
  - "apps/*"
  - "packages/*"

overrides:
  # GHSA-7589-6fvf-x4pw (ReDoS in Schema.TemplateLiteral). @prisma/config 7.10.1
  # pins effect 3.20.0; 3.22.x is a compatible minor. Drop once Prisma bumps it.
  "effect@<3.22.1": "3.22.5"
  # next@15.5.29 pins postcss 8.4.31 (GHSA-r28c-9q8g-f849 and three related
  # advisories: path traversal / file read via source maps, </style> XSS).
  # 8.5.x is API-compatible. Drop once Next.js ships a patched postcss.
  "postcss@<8.5.23": "8.5.34"
